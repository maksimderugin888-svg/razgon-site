<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok — авторизация · RAZGON</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23D7FF00'/%3E%3Ctext x='32' y='46' font-family='Arial Black,sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='%230A0A0A'%3ER%3C/text%3E%3C/svg%3E">
  <style>
    :root{--bg:#0A0A0A;--surface:#141414;--text:#F5F5F0;--muted:#9a9a95;--acid:#D7FF00}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .card{max-width:640px;margin:20px;background:var(--surface);border:1px solid #222;border-radius:16px;padding:32px 28px;text-align:center}
    .mark{width:44px;height:44px;border-radius:10px;background:var(--acid);color:var(--bg);font-weight:900;display:inline-grid;place-items:center;font-size:28px;margin-bottom:16px}
    h1{font-size:22px;margin:0 0 6px}
    p{color:#cfcfca;line-height:1.6}
    .code{margin-top:18px;padding:14px;background:#0d0d0d;border:1px dashed #333;border-radius:10px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:var(--acid);word-break:break-all;user-select:all}
    .muted{color:var(--muted);font-size:13px;margin-top:14px}
    button{margin-top:14px;background:var(--acid);color:var(--bg);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">R</div>
    <h1>Авторизация TikTok</h1>
    <p id="msg">Обрабатываем ответ авторизации…</p>
    <div id="codebox" class="code" style="display:none"></div>
    <button id="copy" style="display:none">Скопировать код</button>
    <p class="muted">Это служебная страница интеграции RAZGON. Данные не сохраняются на стороне
    страницы — код передаётся только при обмене на сервере.</p>
  </div>
  <script>
    (function(){
      var p = new URLSearchParams(location.search);
      var code = p.get('code'), err = p.get('error');
      var msg = document.getElementById('msg');
      var box = document.getElementById('codebox');
      var btn = document.getElementById('copy');
      if (err){ msg.textContent = 'Авторизация отклонена: ' + err; return; }
      if (code){
        msg.textContent = 'Авторизация прошла. Код ниже — вернитесь в приложение для завершения:';
        box.style.display = 'block'; box.textContent = code;
        btn.style.display = 'inline-block';
        btn.onclick = function(){ navigator.clipboard.writeText(code); btn.textContent = 'Скопировано ✓'; };
      } else {
        msg.textContent = 'Откройте эту страницу по ссылке авторизации TikTok.';
      }
    })();
  </script>
</body>
</html>
